# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  # Native file picker — Sound Settings' "Upload New Audio" uses this to let
  # the user choose an audio file from their device.
  # - Capped below 12.0.0: that major rewrote the API (no more `.platform`,
  #   results return directly instead of via FilePickerResult), which would
  #   break the calls in sound_settings_screen.dart.
  # - Floored at 10.3.10, not lower: 10.3.9 shipped with `FilePicker.platform`
  #   accidentally removed (a bug, fixed in 10.3.10) — an unpinned lower bound
  #   can still resolve to that broken patch.
  file_picker: ">=10.3.10 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/
